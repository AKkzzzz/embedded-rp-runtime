<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>内嵌 RP 运行时模板</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/debug-console.css">
</head>
<body>
  <main class="runtime-shell" id="runtimeShell" data-mode="debug">
    <header class="runtime-topbar">
      <div>
        <p class="eyebrow">EMBEDDED RP RUNTIME / DEBUG</p>
        <h1>卡内后台小酒馆</h1>
      </div>
      <div class="runtime-actions">
        <span class="host-chip" id="hostChip">检测宿主中</span>
        <button type="button" class="secondary" id="exportButton">导出诊断</button>
        <button type="button" class="secondary" id="debugFullscreenButton" aria-pressed="false">全屏</button>
        <button type="button" class="primary" id="startButton">开始游戏</button>
      </div>
    </header>

    <section class="runtime-layout">
      <nav class="debug-nav" aria-label="Debug 页面">
        <button data-page="overview" class="active">总览</button>
        <button data-page="monitor">运行监视</button>
        <button data-page="models">模型</button>
        <button data-page="worldbook">世界书</button>
        <button data-page="state">变量</button>
        <button data-page="presets">预设</button>
        <button data-page="plugins">插件</button>
        <button data-page="memory">记忆</button>
        <button data-page="tools">工具</button>
        <button data-page="images">生图</button>
        <button data-page="diagnostics">诊断</button>
      </nav>

      <section class="debug-workspace">
        <div class="debug-page active" data-debug-page="overview"></div>
        <div class="debug-page" data-debug-page="monitor"></div>
        <div class="debug-page" data-debug-page="models"></div>
        <div class="debug-page" data-debug-page="worldbook"></div>
        <div class="debug-page" data-debug-page="state"></div>
        <div class="debug-page" data-debug-page="presets"></div>
        <div class="debug-page" data-debug-page="plugins"></div>
        <div class="debug-page" data-debug-page="memory"></div>
        <div class="debug-page" data-debug-page="tools"></div>
        <div class="debug-page" data-debug-page="images"></div>
        <div class="debug-page" data-debug-page="diagnostics"></div>
      </section>
    </section>

    <section class="game-surface" id="gameSurface" hidden>
      <div class="conversation-stage">
        <header class="conversation-head">
          <div>
            <p class="eyebrow">SINGLE STAGE / RUNTIME HARNESS</p>
            <h2>持久单舞台</h2>
          </div>
          <div class="runtime-actions">
            <span class="host-chip" id="gameStatus">待机</span>
            <button type="button" class="secondary" id="backToDebug">后台</button>
          </div>
        </header>
        <section class="conversation-log" id="conversationLog" aria-live="polite"></section>
        <footer class="conversation-compose">
          <textarea id="conversationInput" rows="3" placeholder="输入行动、对白或指令……"></textarea>
          <div class="conversation-buttons">
            <button type="button" class="secondary" id="continueButton">继续</button>
            <button type="button" class="secondary" id="regenerateButton">重生成</button>
            <button type="button" class="secondary" id="clearConversationButton">清空</button>
            <button type="button" class="secondary" id="stopGenerationButton" hidden>停止</button>
            <button type="button" class="primary" id="sendConversationButton">发送</button>
          </div>
          <p class="conversation-error" id="conversationError" hidden></p>
        </footer>
      </div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="debug-card"></article>
  </template>

  <script src="data/template-data.js"></script>
  <script src="data/rphub-presets.js"></script>
  <script src="runtime/event-bus.js"></script>
  <script src="runtime/ui-dialog.js"></script>
  <script src="runtime/storage-engine.js"></script>
  <script src="runtime/preset-store.js"></script>
  <script src="runtime/state-guard.js"></script>
  <script src="runtime/host-bridge.js"></script>
  <script src="runtime/generation-monitor.js"></script>
  <script src="runtime/model-gateway.js"></script>
  <script src="runtime/regex-engine.js"></script>
  <script src="runtime/plugin-runtime.js"></script>
  <script src="runtime/image-generation.js"></script>
  <script src="runtime/capability-plugins.js"></script>
  <script src="runtime/community-plugins.js"></script>
  <script src="runtime/vector-memory-engine.js"></script>
  <script src="runtime/worldbook-engine.js"></script>
  <script src="runtime/worldbook-patch-store.js"></script>
  <script src="runtime/memory-engine.js"></script>
  <script src="runtime/summary-engine.js"></script>
  <script src="runtime/tool-engine.js"></script>
  <script src="runtime/prompt-compiler.js"></script>
  <script src="runtime/ui-template-state.js"></script>
  <script src="runtime/conversation-engine.js"></script>
  <script src="runtime/diagnostics.js"></script>
  <script src="scripts/preset-manager.js"></script>
  <script src="scripts/debug-console.js"></script>
  <script src="scripts/conversation-console.js"></script>
  <script src="scripts/bootstrap.js"></script>
</body>
</html>
